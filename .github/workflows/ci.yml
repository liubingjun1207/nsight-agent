name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -m "not integration"
      - run: python -m build
      - run: python -m pip uninstall -y nsight-agent
      - run: python -m pip install --no-deps dist/nsight_agent-1.0.0-py3-none-any.whl
      - run: python -c "import nsight_agent; assert 'site-packages' in nsight_agent.__file__"
      - run: python -m pytest -m "not integration"
